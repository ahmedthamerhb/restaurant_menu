<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم إدارة المنيو</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Cairo', sans-serif;
        }
        .admin-page-container {
            background: #fff;
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .edit-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .edit-modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
        }
    </style>
</head>
<body>

    <div class="admin-page-container">
        
        <!-- شاشة تسجيل الدخول -->
        <div id="admin-login-sec">
            <h2 style="text-align: center; color: #d63031; margin-bottom: 25px;">تسجيل دخول المدير</h2>
            <div class="input-group">
                <label for="admin-name">اسم المدير:</label>
                <input type="text" id="admin-name" placeholder="أدخل اسمك هنا...">
            </div>
            <div class="input-group" style="margin-top: 15px;">
                <label for="admin-pass">كلمة السر:</label>
                <input type="password" id="admin-pass">
            </div>
            <button class="add-to-cart-btn" style="width:100%; margin-top:20px; padding:12px; font-size:16px;" onclick="checkAdminPasswordPage()">تسجيل الدخول</button>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="index.html" style="color: #666; text-decoration: none; font-size: 14px;">← العودة للمنيو الرئيسي</a>
            </div>
        </div>

        <!-- لوحة التحكم الكاملة -->
        <div id="admin-panel-sec" style="display: none;">
            
            <!-- رأس اللوحة -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px;">
                <div>
                    <h2 style="color:#d63031; margin:0; font-size: 20px;">لوحة التحكم الشاملة</h2>
                    <span id="admin-welcome-msg" style="color:#555; font-size:14px; margin-top:5px; display:block;"></span>
                </div>
                <div style="display: flex; gap: 10px;">
                    <a href="index.html" style="background:#00b894; color:white; border:none; padding:8px 15px; border-radius:8px; text-decoration:none; font-size:13px; font-weight:bold;">معاينة المنيو</a>
                    <button onclick="logoutAdminPage()" style="background:#555; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer; font-size:13px;">خروج</button>
                </div>
            </div>

            <!-- أزرار التنقل بين التبويبات -->
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button onclick="switchAdminTab('add')" id="btn-tab-add" style="flex:1; padding:12px; border:none; border-radius:8px; cursor:pointer; background:#d63031; color:white; font-weight:bold;">إضافة وجبة جديدة</button>
                <button onclick="switchAdminTab('manage')" id="btn-tab-manage" style="flex:1; padding:12px; border:none; border-radius:8px; cursor:pointer; background:#eee; color:#333; font-weight:bold;">إدارة وتعديل الوجبات</button>
            </div>

            <!-- 1. قسم إضافة وجبة جديدة -->
            <div id="tab-content-add">
                <div class="customer-info-container">
                    <div class="input-group">
                        <label for="item-name">اسم الوجبة:</label>
                        <input type="text" id="item-name" placeholder="مثال: بركر دجاج">
                    </div>

                    <div class="input-group">
                        <label for="item-price">السعر (د.ع):</label>
                        <input type="number" id="item-price" step="1000" min="0" placeholder="مثال: 6000">
                    </div>

                    <div class="input-group">
                        <label for="item-category">القسم:</label>
                        <select id="item-category" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: inherit;">
                            <option value="meals">الوجبات الرئيسيّة</option>
                            <option value="drinks">المشروبات</option>
                            <option value="appetizers">المقبلات</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="item-file">صورة الوجبة (من المعرض):</label>
                        <input type="file" id="item-file" accept="image/*" style="padding: 5px;">
                    </div>

                    <div class="input-group">
                        <label for="item-desc">الوصف (اختياري):</label>
                        <input type="text" id="item-desc" placeholder="وصف قصير للوجبة...">
                    </div>
                </div>

                <button class="whatsapp-send-btn" style="background-color: #d63031; margin-top: 20px; width: 100%; padding: 12px; font-size: 16px;" onclick="addNewItemFromAdminPage()">حفظ وإضافة الوجبة</button>
            </div>

            <!-- 2. قسم إدارة وتعديل الوجبات -->
            <div id="tab-content-manage" style="display: none;">
                <h4 style="margin-bottom: 15px; font-size:16px; color:#444;">قائمة جميع الوجبات المضافة:</h4>
                <div id="admin-items-list" style="display: flex; flex-direction: column; gap: 12px; max-height: 450px; overflow-y: auto; padding-left: 5px;">
                    <!-- الوجبات تظهر هنا -->
                </div>
            </div>

        </div>
    </div>

    <!-- نافذة منبثقة لتعديل الوجبة (Edit Modal) -->
    <div id="edit-item-modal" class="edit-modal">
        <div class="edit-modal-content">
            <h3 style="margin-top:0; color:#d63031;">تعديل بيانات الوجبة</h3>
            <input type="hidden" id="edit-item-id">
            
            <div class="input-group" style="margin-bottom:10px;">
                <label for="edit-item-name">اسم الوجبة:</label>
                <input type="text" id="edit-item-name">
            </div>

            <div class="input-group" style="margin-bottom:10px;">
                <label for="edit-item-price">السعر (د.ع):</label>
                <input type="number" id="edit-item-price" step="1000" min="0">
            </div>

            <div class="input-group" style="margin-bottom:10px;">
                <label for="edit-item-desc">الوصف:</label>
                <input type="text" id="edit-item-desc">
            </div>

            <div style="display:flex; gap:10px; margin-top:20px;">
                <button onclick="saveItemEdits()" style="flex:1; background:#00b894; color:white; border:none; padding:10px; border-radius:8px; cursor:pointer; font-weight:bold;">حفظ التعديلات</button>
                <button onclick="closeEditModal()" style="flex:1; background:#777; color:white; border:none; padding:10px; border-radius:8px; cursor:pointer;">إلغاء</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
